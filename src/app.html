<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!--
      Applies the stored theme before first paint, so a dark-mode admin
      never flashes white. Svelte state initialises after hydration,
      which is at least one paint too late.

      The nonce is required: `csp.mode: "auto"` emits a nonce-based
      policy, and an un-nonced inline script is exactly what broke the
      downstream fork in #133. `%sveltekit.nonce%` is incompatible with
      prerendering — no route in this app prerenders, and adding one
      would fail the build loudly rather than silently.

      Kept in sync with THEME_INIT_SCRIPT in
      $lib/components/admin/theme.svelte.ts, which a test asserts.
    -->
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          // Admin-scoped (#150). Unscoped, this darkened the PUBLIC
          // surface for every OS-dark visitor — a downstream with a
          // light-branded storefront had prices and nav go invisible
          // under the flipped tokens, reported by a real customer.
          // Dark mode is an admin feature; the public site stays with
          // whatever the site's own CSS declares.
          var isAdmin =
            location.pathname === "/admin" ||
            location.pathname.indexOf("/admin/") === 0;
          var stored = localStorage.getItem("khaopad-theme");
          var dark =
            isAdmin &&
            (stored === "dark" ||
              ((stored === "system" || stored === null) &&
                window.matchMedia("(prefers-color-scheme: dark)").matches));
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
    <!--khaopad:head - deployment-owned fragment from src/app.head.html (#174), injected by $lib/server/app-head.ts; this whole comment is consumed at render time-->
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
