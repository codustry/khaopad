name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Must be >= 22: better-sqlite3@13 (integration tests) declares
          # `engines: node >=22`. On Node 20 it does not fail cleanly —
          # loading it kills the vitest worker with "Worker exited
          # unexpectedly", and vitest then reports "26 passed (46)": the
          # 20 integration tests never ran, and the suite looked mostly
          # green. Also realigns with deploy.yml, which already uses 22.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Step 0 of the theme/engine split (#174). These catch the class of
      # failure every check above is blind to: the build succeeds, the markup
      # is correct, and the page still renders wrong. Both incidents that
      # motivated #174 — dropped font <link>s and an invisible product page —
      # passed the entire pipeline above.
      - name: Guard — CSS inventory (silent Tailwind purge)
        run: pnpm run guard:css
      - name: Theme-contract guard (docs/THEME-CONTRACT.md)
        run: pnpm run guard:contract
