name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Must be >= 22: better-sqlite3@13 (integration tests) declares
          # `engines: node >=22`. On Node 20 it does not fail cleanly —
          # loading it kills the vitest worker with "Worker exited
          # unexpectedly", and vitest then reports "26 passed (46)": the
          # 20 integration tests never ran, and the suite looked mostly
          # green. Also realigns with deploy.yml, which already uses 22.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Paraglide messages
        run: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
