# ⚠ This repo is the ENGINE, not a deployment. Every database, bucket and
# KV id below is a PLACEHOLDER — `pnpm setup` provisions your own set and
# fills them in. There is deliberately no live `khaopad-db`.
#
# The reference deployment is codustry/khaopad-example, which carries its
# own wrangler.toml with real ids. Engine work reaches production by
# syncing to that repo, not by deploying from here.
name = "khaopad"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"
assets = { directory = ".svelte-kit/cloudflare", binding = "ASSETS" }

# ──────────────────────────────────────
# Routes — uncomment and configure for production
# ──────────────────────────────────────
# Single host serves both surfaces:
#   /            → public site
#   /admin/*     → admin (CMS + shop + all future features under one nav shell)
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" },
# ]

# ──────────────────────────────────────
# D1 Database
# ──────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "khaopad-db"
database_id = "LOCAL_DB_ID"           # Replace with your own D1 id — see `pnpm setup`
migrations_dir = "drizzle"

# ──────────────────────────────────────
# R2 Media Bucket
# ──────────────────────────────────────
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "khaopad-media"

# ──────────────────────────────────────
# KV Content Cache
# ──────────────────────────────────────
# ─── Auth rate limiting (#182) ────────────────────────────────
# Cloudflare's purpose-built per-colo rate limiter guarding credential
# endpoints (sign-in, change-password, OTP send). KV cannot do this job:
# production KV caches reads for >= 60s, so short-window counters never
# accumulate — verified live before this binding replaced that design.
# `simple.limit` is attempts per `period` seconds per key (ip|path).
# Period must be 10 or 60. Slightly looser than Better Auth's own 3/10s
# so its friendlier per-endpoint message usually fires first; this is
# the backstop that actually holds on Workers.
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1821"
simple = { limit = 5, period = 10 }

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "PRODUCTION_KV_ID"

# ──────────────────────────────────────
# Environment variables
# ──────────────────────────────────────
[vars]
# Drives robots.txt and the X-Robots-Tag header. Anything except
# "production" (including unset) is noindexed — fail-closed (#145).
WORKERS_ENV = "production"
SUPPORTED_LOCALES = "en,th"
DEFAULT_LOCALE = "en"
PUBLIC_SITE_URL = "https://example.com"
# CMS_SITE_URL is kept for backwards-compat (R2 media URL generation).
# Since v1.1 the admin lives at /admin/* on the same host as the public site.
CMS_SITE_URL = "https://example.com"
BETTER_AUTH_URL = "https://example.com"

# ─── @khaopad/plugin-careers (optional) ───────────────────────
# Public job feed for /{locale}/careers, in the Tonbab People
# (Greenhouse/Lever-shaped) format. Leave UNSET to disable: the careers
# route 404s and no nav entry is rendered, so an install that doesn't
# recruit behaves as if the feature doesn't exist.
#
# Not a secret — the feed is a public, unauthenticated, read-only
# endpoint, so [vars] is the right home for it rather than a secret.
# CAREERS_FEED_URL = "https://app.tonbab.com/api/careers/<tenant-slug>/jobs"

# ──────────────────────────────────────
# Environments
# ──────────────────────────────────────
# Each environment gets its OWN D1 database, R2 bucket, and KV namespace —
# never share state across envs (a destructive migration on staging should
# never touch production). `pnpm setup` creates the default set; re-run it
# with `--env staging` to provision a parallel stack.
#
# Deploy:
#   wrangler deploy --env staging
#   wrangler deploy --env production
#
# The top-level config above is what `pnpm dev` and `pnpm wrangler:dev` use
# locally. CI deploys go through one of the named envs below.

[env.staging]
name = "khaopad-staging"
# routes = [
#   { pattern = "staging.example.com/*", zone_name = "example.com" },
# ]

[env.staging.vars]
WORKERS_ENV = "staging"
SUPPORTED_LOCALES = "en,th"
DEFAULT_LOCALE = "en"
PUBLIC_SITE_URL = "https://staging.example.com"
CMS_SITE_URL = "https://staging.example.com"
BETTER_AUTH_URL = "https://staging.example.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "khaopad-db-staging"
database_id = "STAGING_DB_ID"
migrations_dir = "drizzle"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "khaopad-media-staging"

[[env.staging.kv_namespaces]]
binding = "CONTENT_CACHE"
id = "STAGING_KV_ID"

[env.production]
name = "khaopad"
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" },
# ]

[env.production.vars]
WORKERS_ENV = "production"
SUPPORTED_LOCALES = "en,th"
DEFAULT_LOCALE = "en"
PUBLIC_SITE_URL = "https://example.com"
CMS_SITE_URL = "https://example.com"
BETTER_AUTH_URL = "https://example.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "khaopad-db"
database_id = "PRODUCTION_DB_ID"
migrations_dir = "drizzle"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "khaopad-media"

[[env.production.kv_namespaces]]
binding = "CONTENT_CACHE"
id = "PRODUCTION_KV_ID"

# ──────────────────────────────────────
# Cron Triggers (v3.2 shop plugin)
# ──────────────────────────────────────
# OPTIONAL since #154: default installs no longer depend on cron —
# /api/shop/checkout/start runs an opportunistic sweep (throttled via
# the CONTENT_CACHE KV key `shop:lastSweepAt`) whenever the last sweep
# is older than the 15-min reservation TTL. Enabling cron is an
# optimization: it also drives the abandoned-cart recovery emails on a
# reliable schedule instead of piggybacking on checkout traffic.
# To enable, uncomment the triggers block below and set CRON_SECRET in
# [vars]. The endpoint at /api/shop/cron/sweep runs
# `sweepExpiredReservations` (15-min TTL) + `sweepAbandonedCarts`
# (30-day TTL).
#
# Cloudflare Cron Triggers fire the Worker's `scheduled` handler; for
# v3.2 we use an HTTP endpoint fetched from that handler for simpler
# per-plugin ownership. If you enable the fetch pattern, wire it in
# your Worker entry.
#
# [triggers]
# crons = ["* * * * *"]  # every minute
#
# Then set CRON_SECRET in [vars]:
# CRON_SECRET = "generate-with-openssl-rand-hex-32"

# ──────────────────────────────────────
# Anonymous install telemetry (#199) — OFF unless you opt in
# ──────────────────────────────────────
# The engine can send a small anonymous weekly ping so the maintainers
# can see how many installs exist. It is off by default and stays off
# until BOTH of these are true:
#
#   1. TELEMETRY_ENDPOINT below is set, and
#   2. a site admin ticks Settings → Anonymous usage data.
#
# No site URL, no hostname, no IP, no user data, no content and no
# exact counts are ever sent. docs/TELEMETRY.md lists every field.
#
# Sending happens only from the weekly cron tick at /api/telemetry/cron
# (guarded by CRON_SECRET, same as the shop sweep) — never from a page
# render, so no visitor ever waits on it.
#
# [vars]
# TELEMETRY_ENDPOINT = "https://khaopad-analytics.<subdomain>.workers.dev/v1/ping"
#
# To force telemetry OFF regardless of the admin setting — useful when
# you manage a fleet and want silence guaranteed from deploy config:
# KHAOPAD_TELEMETRY_DISABLED = "1"
#
# Add the weekly schedule to the [triggers] crons list above:
#   crons = ["0 3 * * 1"]  # Mondays 03:00 UTC
